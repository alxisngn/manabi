<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B1D2B">
  <title>Manabi 学び — Học tiếng Nhật</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="#/" class="brand" aria-label="Trang chủ Manabi">
        <span class="brand-title">Manabi</span>
        <span class="brand-jp">学び</span>
      </a>
      <button type="button" id="btn-backup" class="btn btn-icon" title="Sao lưu / Khôi phục dữ liệu" aria-label="Sao lưu dữ liệu">
        ⇄
      </button>
    </header>

    <main id="app" class="main-view" aria-live="polite"></main>
  </div>

  <dialog id="backup-modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h2 class="modal-title">Dữ liệu học tập</h2>
        <button type="button" id="btn-close-modal" class="btn btn-icon" aria-label="Đóng">✕</button>
      </div>
      <p class="modal-desc">Sao lưu toàn bộ từ vựng tự thêm và danh sách từ yếu ra file JSON hoặc khôi phục lại.</p>
      <div class="modal-actions">
        <button type="button" id="btn-export" class="btn btn-teal">⬇ Xuất file backup</button>
        <label class="btn btn-yellow file-label">
          ⬆ Nhập file backup
          <input type="file" id="input-import" accept="application/json" hidden>
        </label>
      </div>
      <p id="backup-msg" class="backup-msg" hidden></p>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>

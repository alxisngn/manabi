<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B1D2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manabi">
  <title>Manabi 学び — Học tiếng Nhật</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/grammar.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="#/" class="brand" aria-label="Trang chủ Manabi">
        <span class="brand-title">Manabi</span>
        <span class="brand-jp">学び</span>
      </a>
      <button type="button" id="btn-level-chip" class="btn level-chip" aria-label="Chọn cấp độ JLPT">
        <span id="level-chip-label">N4</span>
        <span aria-hidden="true">▾</span>
      </button>
    </header>

    <main id="app" class="main-view" aria-live="polite"></main>
  </div>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Điều hướng chính">
    <a href="#/" class="nav-tab" data-tab="today">
      <span class="nav-ico" aria-hidden="true">🏠</span>
      <span class="nav-lbl">Hôm nay</span>
    </a>
    <a href="#/learn" class="nav-tab" data-tab="learn">
      <span class="nav-ico" aria-hidden="true">📚</span>
      <span class="nav-lbl">Luyện</span>
    </a>
    <a href="#/exam" class="nav-tab" data-tab="exam">
      <span class="nav-ico" aria-hidden="true">📝</span>
      <span class="nav-lbl">Đề thi</span>
    </a>
    <a href="#/progress" class="nav-tab" data-tab="progress">
      <span class="nav-ico" aria-hidden="true">📊</span>
      <span class="nav-lbl">Tiến độ</span>
    </a>
    <a href="#/me" class="nav-tab" data-tab="me">
      <span class="nav-ico" aria-hidden="true">👤</span>
      <span class="nav-lbl">Tôi</span>
    </a>
  </nav>

  <dialog id="level-modal" class="modal modal-sheet">
    <div class="modal-card sheet-card">
      <div class="modal-head">
        <h2 class="modal-title">Chọn cấp độ JLPT</h2>
        <button type="button" id="btn-close-level" class="btn btn-icon" aria-label="Đóng">✕</button>
      </div>
      <div id="level-list" class="level-sheet-list"></div>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>

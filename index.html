<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B1D2B">
  <title>Manabi 学び — Học tiếng Nhật</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="#/" class="brand" aria-label="Trang chủ Manabi">
        <span class="brand-title">Manabi</span>
        <span class="brand-jp">学び</span>
      </a>
      <button type="button" id="btn-menu" class="btn btn-icon" title="Danh mục" aria-label="Mở danh mục">☰</button>
    </header>

    <main id="app" class="main-view" aria-live="polite"></main>
  </div>

  <dialog id="menu-modal" class="modal">
    <div class="modal-card" style="max-height:88dvh;overflow-y:auto;">
      <div class="modal-head">
        <h2 class="modal-title">Danh mục</h2>
        <button type="button" id="btn-close-menu" class="btn btn-icon" aria-label="Đóng">✕</button>
      </div>
      <div id="menu-body" style="display:flex;flex-direction:column;gap:14px;"></div>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
